apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment-servers
  labels:
    app: sentiments-frontend

spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentiments-frontend

  template:
    metadata:
      labels:
        app: sentiments-frontend

    spec:
      containers:
      - name: front-end
        image: front-end-dev:latest
        ports:
          - containerPort: 80
        resources:
          limits:
            memory: 200Mi
            cpu: 40m
          requests:
            memory: 100Mi
            cpu: 20m

      - name: back-end
        image: back-end-dev:latest
        ports:
          - containerPort: 8000
        resources:
          limits:
            memory: 400Mi
            cpu: 80m
          requests:
            memory: 200Mi
            cpu: 40m