apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  labels:
    name: my-ingress
spec:
  rules:
  - host: dev.sentiments.henrywalker.tech
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: front-end-service
            port: 
              number: 80

      - pathType: Prefix
        path: "/api"
        backend:
          service: 
            name: front-end-service
            port: 
              number: 80