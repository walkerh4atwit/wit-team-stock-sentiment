apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment-cache-collector-${BUILD_ENV}
spec:
  
  replicas: 1
  selector:
    matchLabels:
      app: my-deployment-cache-collector-${BUILD_ENV}
  template:
    metadata:
      labels:
        app: my-deployment-cache-collector-${BUILD_ENV}
    spec:
      imagePullSecrets:
      - name: ocir-ipull-secret 
      containers:
      - name: cache-collector
        image: iad.ocir.io/${OCI_NAMESPACE}/data-collection-${BUILD_ENV}:latest
        env:
          - name: BUILD_ENV
            value: ${BUILD_ENV}
        envFrom:
          - secretRef:
              name: alpaca-keys
          - secretRef:
              name: ${DB_CREDS_KEY}
          - secretRef:
              name: oci-creds
        resources:
          limits:
            memory: 200Mi
            cpu: 80m
          requests:
            memory: 100Mi
            cpu: 40m
        ports:
        - containerPort: 8080
